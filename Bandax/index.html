<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Batalha das Bandas</h1>
    <h3>Inscreva o seu grupo no maior evento independente</h3>

    <div>
        <form action="">
            <label for="">Gênero Musical Principal</label>
            <input list="estilo">
            <datalist id="estilo">

                <option value="">Digite ou selecione o seu estilo</option>
                <option valeu="">Rock</option>
                <option valeu="">Metal</option>
                <option valeu="">Jazz</option>
                <option valeu="">MPB</option>

            </datalist>

            <div>

                <label for="">Tempo de entrada da Banda</label>
                <input type="date" name="data">

            </div>

            <div>
                <label for="">Selecione o sua música demo(Audio)</label>
                <input type="file" name="arquivo">
            </div>

            <div>
                <label for="">Foto Oficial da sua Banda</label>
                <input type="file" name="arquivo">

            </div>

            <div>
                <label for="">Disponibilidade de data</label>
                <input type="date">

            </div>

            <div>
                <label for="">Formato do Reportório</label>
                <select name="Formato">
                    <option>100% Autoral</option>
                    <option>Apenas Cover/Tributo</option>
                    <option>Misto(Autoral + Cover)</option>
                </select>
            </div>

            <div>
                <div>
                    <label for="">Quais instrumentos próprios a banda contém?</label>
                </div>
                
                <input type="checkbox" id="leitura" name="hobbies" value="livros" checked>
                <label for="">Microfones próprios</label>
            </div>
        
            <div>
                <input type="checkbox" id="esportes" name="hobbies" value="esportes">
                <label for="">Guitarras/Baixos</label>
            </div>
        
            <div>
                <input type="checkbox" id="jogos" name="hobbies" value="games">
                <label for="">Pratos de bateria/Caixas</label>
            </div>

            <div>
                <input type="button" value="Inscrição">
            </div>
                
        </form> 
    </div>
</body>

</html>
